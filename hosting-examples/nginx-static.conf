# Location snippets for a static document root. Merge into the correct server.
# Do not shadow the existing member application's account/API routes.
index index.html;
location / {
  try_files $uri $uri/ =404;
}
error_page 404 /404.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
# Staging only; remove after public release approval and rebuild.
add_header X-Robots-Tag "noindex, nofollow" always;
